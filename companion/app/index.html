<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Lampa Sleep Companion</title>
  <style>
    body{margin:0;background:#101317;color:#fff;font-family:Arial,sans-serif}
    main{max-width:900px;margin:0 auto;padding:72px 56px}
    h1{font-size:42px}
    p,button,pre{font-size:22px}
    #code{font-size:72px;letter-spacing:12px;font-weight:700;margin:28px 0}
    pre{padding:18px;background:#20262c;border-radius:12px;white-space:pre-wrap}
    button{padding:14px 22px;margin:8px 12px 8px 0}
  </style>
</head>
<body>
<main>
  <h1>Lampa Sleep Companion</h1>
  <p>Companion для локальной интеграции Lampa Sleep с LG webOS.</p>
  <div id="code">------</div>
  <p id="expiry">Код еще не создан.</p>
  <button id="new-code">Новый код</button>
  <button id="refresh">Обновить статус</button>
  <button id="revoke">Отозвать Lampa</button>
  <pre id="status">Загрузка...</pre>
  <p>Код действует 5 минут. Введите его в настройках Lampa Sleep.</p>
</main>
<script src="app.js"></script>
</body>
</html>
